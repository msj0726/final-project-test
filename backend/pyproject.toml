[project]
name = "presentation-coaching-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "httpx>=0.27,<1"]

[project.optional-dependencies]
vision = ["ultralytics==8.4.198", "mediapipe==0.10.32", "scipy>=1.11,<2", "pandas>=2,<3", "seaborn>=0.13,<1", "pyyaml>=6,<7", "tqdm>=4,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
